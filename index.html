<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dalmatian Species Survival Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <section id="start-screen" class="screen">
        <h1>Dalmatian Species Survival Game</h1>
        <div class="button-row">
          <button id="apollo-button" type="button">Apollo Butterfly</button>
          <button id="vulture-button" type="button">Griffin Vulture</button>
        </div>
      </section>

      <section id="game-screen" class="screen hidden">
        <div class="hud">
          <span id="species-label">Species</span>
          <span>Score: <strong id="score-label">0</strong></span>
        </div>
        <canvas id="game-canvas" width="720" height="420"></canvas>
      </section>

      <section id="game-over-screen" class="screen hidden">
        <h2>Game Over</h2>
        <p class="score-line">Final score: <strong id="final-score">0</strong></p>
        <p id="fact-text" class="fact"></p>
        <button id="restart-button" type="button">Restart</button>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
</html>
